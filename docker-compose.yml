# Ponto de partida OPCIONAL. Usar Docker é um desejável, não uma obrigação.
# O mock-service e um banco já estão prontos. Se quiser, complete com os SEUS
# serviços: "api" (NestJS) e "web" (React).

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data


  api:
    build: ./api
    environment:
      CADASTRO_URL: http://mock-service:4000
      # DATABASE_URL: postgres://desafio:desafio@db:5432/checkin  (se usar banco)
    ports:
      - "3000:3000"
    depends_on:
      - mock-service
  
  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
